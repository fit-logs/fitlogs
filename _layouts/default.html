<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} · FitLogs</title>
  <style>
    body { margin:0; color:#172c3d; background:#f7f9fc; font:17px/1.65 system-ui,sans-serif; }
    main { max-width:820px; margin:48px auto; padding:32px; background:white; border-radius:16px; }
    nav { display:flex; gap:24px; margin-bottom:32px; }
    a { color:#165fa5; text-underline-offset:3px; }
    h1,h2 { line-height:1.2; } li { margin-bottom:14px; }
    @media(max-width:600px) { main { margin:0; padding:24px; border-radius:0; } }
  </style>
</head>
<body>
<main>
  <nav><a href="{{ '/' | relative_url }}">FitLogs</a><a href="{{ '/privacy/' | relative_url }}">Privacy</a><a href="https://github.com/fit-logs/fitlogs">Source</a></nav>
  {{ content }}
</main>
</body>
</html>
