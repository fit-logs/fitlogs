name: Android CI

on:
  pull_request:
    paths:
      - 'android/**'
      - 'data/programs/**'
      - 'web/public/catalog/**'
      - '.github/workflows/android-ci.yml'
      - '.github/workflows/android-release.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'data/programs/**'
      - 'web/public/catalog/**'
      - '.github/workflows/android-ci.yml'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test automatic release selection
        run: python3 -m unittest discover -s android/scripts -p 'test_release_metadata.py' -v
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install required Android SDK
        run: sdkmanager --channel=3 --install 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools'
      - name: Test, lint and assemble unsigned APK
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --no-daemon --console=plain
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-reports
          if-no-files-found: ignore
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-*.html
            android/app/build/test-results/
