name: Android CI

on:
  pull_request:
    paths:
      - 'android/**'
      - 'data/programs/**'
      - 'catalog/**'
      - 'scripts/*catalog*'
      - '.github/workflows/android-ci.yml'
      - '.github/workflows/android-release.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'data/programs/**'
      - 'catalog/**'
      - 'scripts/*catalog*'
      - '.github/workflows/android-ci.yml'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GRADLE_OPTS: -Dorg.gradle.caching=true

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test automatic release selection
        run: python3 -m unittest discover -s android/scripts -p 'test_*.py' -v
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema==4.26.0
      - run: python scripts/validate_catalog.py
      - run: python scripts/test_catalog_validation.py
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Restore Gradle dependencies and build cache
        uses: gradle/actions/setup-gradle@v5
        with:
          # Same-repository PRs can reuse their own cache on the next update.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install required Android SDK
        run: sdkmanager --channel=3 --install 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools'
      - name: Test, lint and assemble unsigned APK
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease :app:assembleDebugAndroidTest --no-daemon --console=plain --profile
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-reports
          if-no-files-found: ignore
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-*.html
            android/app/build/test-results/
            android/build/reports/profile/
