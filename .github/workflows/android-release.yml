name: Publish Android release
run-name: Publish Android release (${{ github.event_name }})

on:
  push:
    branches: [main]
    paths:
      - 'android/app/build.gradle.kts'
      - 'android/version.properties'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional tag matching Android versionName; defaults to the current version'
        required: false
        type: string

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.caching=true

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test release selection
        run: python3 -m unittest discover -s android/scripts -p 'test_*.py' -v
      - name: Select changed Android version or manual retry
        id: release
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: python3 android/scripts/release_metadata.py
  publish:
    needs: prepare
    # Only main version changes and explicit main retries can access signing.
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.publish == 'true'
    concurrency:
      group: android-release-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate tag and refuse to overwrite published releases
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo 'Invalid release tag.' >&2
            exit 1
          fi
          if [[ ! -f "android/docs/releases/$RELEASE_TAG.md" ]]; then
            echo "Missing release notes for $RELEASE_TAG." >&2
            exit 1
          fi
          if git show-ref --quiet --verify "refs/tags/$RELEASE_TAG"; then
            tagged_sha=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
            if [[ "$tagged_sha" != "$GITHUB_SHA" ]]; then
              echo "Tag $RELEASE_TAG already points to $tagged_sha, not $GITHUB_SHA. Refusing to retag." >&2
              exit 1
            fi
          fi
          release_state=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [[ "$release_state" == 'false' ]]; then
            echo "Release $RELEASE_TAG is already published. Refusing to overwrite it." >&2
            exit 1
          fi
      - name: Check required signing secrets
        env:
          FITNOTES_KEYSTORE_BASE64: ${{ secrets.FITNOTES_KEYSTORE_BASE64 }}
          FITNOTES_STORE_PASSWORD: ${{ secrets.FITNOTES_STORE_PASSWORD }}
          FITNOTES_KEY_PASSWORD: ${{ secrets.FITNOTES_KEY_PASSWORD }}
          FITNOTES_KEY_ALIAS: ${{ secrets.FITNOTES_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          for name in FITNOTES_KEYSTORE_BASE64 FITNOTES_STORE_PASSWORD FITNOTES_KEY_PASSWORD FITNOTES_KEY_ALIAS; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing GitHub Actions signing secret $name. Configure the ORIGINAL beta.1 signing key before publishing." >&2
              exit 1
            fi
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Restore Gradle dependencies and build cache
        uses: gradle/actions/setup-gradle@v5
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install required Android SDK
        run: sdkmanager --channel=3 --install 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools'
      - name: Restore original signing keystore in temporary runner storage
        env:
          FITNOTES_KEYSTORE_BASE64: ${{ secrets.FITNOTES_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$FITNOTES_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fitnotes.keystore"
          echo "FITNOTES_KEYSTORE=$RUNNER_TEMP/fitnotes.keystore" >> "$GITHUB_ENV"
      - name: Test, build and verify correctly signed APK
        working-directory: android
        env:
          FITNOTES_STORE_PASSWORD: ${{ secrets.FITNOTES_STORE_PASSWORD }}
          FITNOTES_KEY_PASSWORD: ${{ secrets.FITNOTES_KEY_PASSWORD }}
          FITNOTES_KEY_ALIAS: ${{ secrets.FITNOTES_KEY_ALIAS }}
          FITNOTES_BUILD_TOOLS: '36.0.0'
        run: ./scripts/package-release.sh
      - name: Upload verified updater assets and publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 android/scripts/publish_release.py --tag "$RELEASE_TAG" --commit "$GITHUB_SHA"
      - name: Remove temporary signing keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/fitnotes.keystore"
