name: Public app documentation

on:
  push:
    branches: [main]
    paths: ['index.md', 'PRIVACY.md', '_config.yml', '_layouts/**', '.github/workflows/public-pages.yml']
  pull_request:
    paths: ['index.md', 'PRIVACY.md', '_config.yml', '_layouts/**', '.github/workflows/public-pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
